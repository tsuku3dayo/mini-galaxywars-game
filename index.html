<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="銀河戦争ミニ" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>銀河戦争ミニ</title>
    <!-- 起動の復旧（MGW-TD-0007 §3）。アプリ本体より先に読む -->
    <script src="/boot.js"></script>
  </head>
  <body data-screen="title">
    <!-- 画面の骨組み（MGW-TD-0004 §2） -->
    <div id="app">
      <div id="stage">
        <canvas id="game"></canvas>
        <!-- 出撃待ちの案内（MGW-GUI-0003 §4） -->
        <p id="standby-hint" hidden></p>
        <section id="screen-title" class="screen">
          <h1 class="app-name">銀河戦争ミニ</h1>
        </section>
        <section id="screen-ranking" class="screen"></section>
      </div>
      <!-- 操作空間（タッチ端末だけ。角の丸い枠。MGW-GUI-0003 §2） -->
      <div id="control-area" hidden>
        <div class="control-box"><span>ここをなぞって移動・タップで発射</span></div>
      </div>
      <!-- ボタンの段（一時停止・効果音。プレイ画面だけ。MGW-GUI-0001 §2） -->
      <div id="play-buttons"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
